<main class="container section"><h1>Contact &amp; Student Feedback</h1><p class="lead">Complete this sample feedback form.</p>
<form class="card contact-form" action="#" method="POST">
<label for="full-name">Full Name</label><input id="full-name" name="full-name" type="text" required>
<label for="email">Email Address</label><input id="email" name="email" type="email" required>
<label for="password">Password</label><input id="password" name="password" type="password" required>
<fieldset><legend>User Role</legend><label><input type="radio" name="role" value="student" required> Student</label><label><input type="radio" name="role" value="teacher"> Teacher</label><label><input type="radio" name="role" value="visitor"> Visitor</label></fieldset>
<fieldset><legend>Interests</legend><label><input type="checkbox" name="interest" value="html"> HTML</label><label><input type="checkbox" name="interest" value="css"> CSS</label><label><input type="checkbox" name="interest" value="programming"> Programming</label></fieldset>
<label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea>
<label for="category">Subject Category</label><select id="category" name="category" required><option value="">Choose a category</option><option>Suggestion</option><option>Question</option><option>Feedback</option></select>
<div class="button-row"><button class="button" type="submit">Submit</button><button class="button secondary" type="reset">Reset</button></div>
</form></main><footer>&copy; 2026 Team Tech. All rights reserved.</footer></body></html>
